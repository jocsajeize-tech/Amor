<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para você, meu amor</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fdf2f2; margin: 0; }
        .container { text-align: center; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
        #conteudo-secreto { display: none; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #ff4d6d; color: white; border: none; border-radius: 5px; cursor: pointer; }
        img { width: 100%; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container" id="login">
    <h2>🔐 Entrada Secreta</h2>
    <p>Digite nossa senha para ver o presente:</p>
    <input type="password" id="senha" placeholder="Sua senha">
    <button onclick="verificar()">Entrar</button>
</div>

<div class="container" id="conteudo-secreto">
    <h1>Feliz Dia dos Namorados! ❤️</h1>
    <p>Aqui você coloca o seu texto da carta... escreva algo bem emocionante!</p>
    <img src="SUA_FOTO.jpg" alt="Nossa foto">
</div>

<script>
    function verificar() {
        const senha = document.getElementById('senha').value;
        if (senha === "1234") { // AQUI VOCÊ MUDA A SENHA
            document.getElementById('login').style.display = 'none';
            document.getElementById('conteudo-secreto').style.display = 'block';
        } else {
            alert("Senha incorreta, meu amor!");
        }
    }
</script>
</body>
</html>
